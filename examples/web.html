<!DOCTYPE html>
<html lang="en">
  <head>
    <title>pride-overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="p-12">
    <div class="grid grid-cols-2 *:flex *:flex-col *:items-center">
      <div>
        <h1 class="text-3xl font-bold mb-2">Before</h1>
        <img src="/examples/data/image.webp" alt="Before" />
      </div>
      <div>
        <h1 class="text-3xl font-bold mb-2">After</h1>
        <img id="output" alt="Loading..." />
      </div>
    </div>

    <script type="module">
      // initialise the module
      import init, { Image, Flag, Effect } from "../pkg/pride_overlay.js";
      await init();

      // fetch the input data
      const data = await fetch("/examples/data/image.webp")
        .then((res) => res.arrayBuffer())
        .then((buf) => new Uint8Array(buf));

      // apply the effect
      const image = await Image.read(data);
      image.apply(Flag.Rainbow, Effect.Overlay);
      const out = image.write();
      console.log(out);

      // display the result
      const url = URL.createObjectURL(new Blob([out], { type: "image/webp" }));
      const img = document.querySelector("img#output");
      img.src = url;
    </script>
  </body>
</html>
