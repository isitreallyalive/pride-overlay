[package]
name = "pride-overlay"
description = "overlay pride flags on images"
version = "3.0.1"
edition = "2024"

authors = ["newt <hi@newty.dev>"]
keywords = ["pride", "lgbtq", "flags", "image-processing", "graphics"]
categories = ["graphics", "multimedia::images"]

repository = "https://github.com/isitreallyalive/pride-overlay"
readme = "readme.md"
license-file = "license.md"
include = ["**/*.rs", "src/flags/svg/*.svg"]

[features]
default = ["rayon"]
rayon = ["image/rayon", "imageproc/rayon"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bon = { version = "3.8.2", default-features = false, features = ["std"] }
image = { version = "0.25.9", default-features = false }
imageproc = { version = "0.26.0", default-features = false }
paste = "1.0.15"
resvg = { version = "0.46.0", default-features = false }

[dev-dependencies]
image = { version = "0.25.8", features = ["webp"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1.7", default-features = false }
image = { version = "0.25.8", default-features = false, features = ["default-formats"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
tsify = { version = "0.5.6", default-features = false, features = ["wasm-bindgen", "js"] }
wasm-bindgen = { version = "0.2.106", default-features = false, features = [
    "std",
] }
