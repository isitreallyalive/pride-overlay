[package]
name = "pride-overlay"
description = "overlay pride flags on images"
version = "4.0.0"
edition = "2024"

authors = ["newt <hi@newty.dev>"]
keywords = ["pride", "lgbtq", "flags", "image-processing", "graphics"]
categories = ["graphics", "multimedia::images"]

repository = "https://github.com/isitreallyalive/pride-overlay"
readme = "readme.md"
license-file = "license.md"

[features]
default = ["gif", "rayon"]
rayon = ["dep:rayon", "image/rayon"]

# todo: format features
gif = ["dep:gif"]
webp = ["image/webp"]

[dependencies]
gif = { version = "0.14.1", optional = true }
image = { version = "0.25.9", default-features = false }
rand = "0.9.2"
rayon = { version = "1.11.0", optional = true }
thiserror = "2.0.17"

[dev-dependencies]
image = { version = "0.25.9", features = ["webp"], default-features = false }
