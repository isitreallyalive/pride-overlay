[package]
name = "pride-overlay"
description = "overlay pride flags on images"
version = "4.0.0"
edition = "2024"

authors = ["newt <hi@newty.dev>"]
keywords = ["pride", "lgbtq", "flags", "image-processing", "graphics"]
categories = ["graphics", "multimedia::images"]

repository = "https://github.com/isitreallyalive/pride-overlay"
readme = "readme.md"
license-file = "license.md"

[lib]
crate-type = [
    "rlib",  # rust
    "cdylib" # wasm
]

[features]
default = ["gif", "rayon", "default-formats"]
rayon = ["dep:rayon", "image/rayon", "imageproc/rayon"]

# todo: format features
gif = ["dep:gif"]
webp = ["dep:webp", "dep:wasm-bindgen-futures", "dep:web-sys", "web-sys/ImageData"]
png = ["dep:png"]

default-formats = ["gif", "webp", "png"]
all-formats = ["gif", "webp", "png"]

[dependencies]
bon = "3.8.2"
gif = { version = "0.14.1", optional = true }
image = { version = "0.25.9", default-features = false }
imageproc = { version = "0.26.0", default-features = false }
png = { version = "0.18.0", optional = true }
rayon = { version = "1.11.0", optional = true }
thiserror = "2.0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait = "0.1.89"
console_error_panic_hook = "0.1.7"
maybe-async = "0.2.10"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = { version = "0.4.58", optional = true }
web-sys = { version = "0.3.85", features = ["console"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maybe-async = { version = "0.2.10", features = ["is_sync"] }
webp = { version = "0.3.1", optional = true }
